name: Theme checks

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          find . -path './lib/plugin-update-checker' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
